          <span class="text-xl">📈</span><span class="flex-1 font-medium">学习记录</span><svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
        <button onclick="App.exportMyProgress()" class="w-full flex items-center gap-3 p-4 hover:bg-gray-50 text-left">
          <span class="text-xl">📤</span><span class="flex-1 font-medium">导出学习进度</span><span class="text-sm text-gray-400">发给管理者</span>
        </button>
      </div>

      <!-- Logout -->
      <button onclick="App.logout()" class="w-full py-3 bg-red-50 text-red-600 rounded-xl font-medium hover:bg-red-100 transition">退出登录</button>
    </div>`;
  },

  // ─── ERROR BOOK ─────────────────────────────────────
  renderErrorBook(el) {
    this.setActiveTab('profile');
    document.getElementById('page-title').textContent = '错题本';
    const errors = JSON.parse(localStorage.getItem('atc_errors') || '[]');

    el.innerHTML = `<div class="animate-fade-in">
      <button onclick="location.hash='#profile'" class="flex items-center gap-1 text-sm text-gray-500 hover:text-brand-600 mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        返回个人中心
      </button>
      ${errors.length === 0 ? '<div class="text-center text-gray-400 py-16"><div class="text-4xl mb-3">🎉</div>暂无错题，继续保持！</div>' :
        `<div class="text-sm text-gray-500 mb-4">共 ${errors.length} 道错题</div>
        ${errors.map((err, i) => `
          <div class="card mb-3">
            <div class="flex items-center gap-2 mb-2">
              <span class="badge badge-gray">${err.source === 'exam' ? '考试' : err.source === 'quiz' ? '小测' : '练习'}</span>
              <span class="text-xs text-gray-400">${new Date(err.date).toLocaleDateString('zh-CN')}</span>
            </div>
            <div class="font-medium text-gray-900 mb-2">${err.question}</div>
            <div class="text-sm text-red-500 mb-1">你的答案：${err.type === 'multi' ? (err.userAnswer||[]).map(i => err.options[i]).join('、') : (err.userAnswer !== undefined ? err.options[err.userAnswer] : '未作答')}</div>
            <div class="text-sm text-green-600 mb-2">正确答案：${err.type === 'multi' ? err.answer.map(i => err.options[i]).join('、') : err.options[err.answer]}</div>
            ${err.explanation ? `<div class="text-sm text-gray-500 bg-gray-50 rounded-lg p-2">💡 ${err.explanation}</div>` : ''}
          </div>
        `).join('')}
        <button onclick="App.clearErrors()" class="w-full py-3 bg-gray-100 text-gray-500 rounded-xl text-sm mt-4">清空错题本</button>
      `}
    </div>`;
  },

  addError(question, userAnswer, source) {
    const errors = JSON.parse(localStorage.getItem('atc_errors') || '[]');
    if (errors.find(e => e.id === question.id)) return; // Already in error book
    errors.push({ ...question, userAnswer, source, date: new Date().toISOString() });
    localStorage.setItem('atc_errors', JSON.stringify(errors));
  },
  clearErrors() {
    if (confirm('确定清空所有错题？')) {
      localStorage.setItem('atc_errors', '[]');
      this.renderErrorBook(document.getElementById('app-content'));
      this.toast('错题本已清空');
    }
  },

  // ─── EXAM HISTORY ──────────────────────────────────
  renderExamHistory(el) {
    this.setActiveTab('exam');
    document.getElementById('page-title').textContent = '考试记录';
    const history = JSON.parse(localStorage.getItem('exam_history') || '[]');
    el.innerHTML = `<div class="animate-fade-in">
      <button onclick="location.hash='#exam'" class="flex items-center gap-1 text-sm text-gray-500 hover:text-brand-600 mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        返回考试中心
      </button>
      ${history.length === 0 ? '<div class="text-center text-gray-400 py-16"><div class="text-4xl mb-3">📝</div>暂无考试记录</div>' :
        history.reverse().map(e => `
          <div class="card mb-3 flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl font-bold ${e.score >= e.passScore ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-500'}">${e.score}</div>
            <div class="flex-1">
              <div class="font-semibold">${e.paperName}</div>
              <div class="text-sm text-gray-400">${new Date(e.date).toLocaleString('zh-CN')} · 用时${e.timeUsed || '-'}</div>
            </div>
            <span class="badge ${e.score >= e.passScore ? 'badge-green' : 'badge-red'}">${e.score >= e.passScore ? '已通过' : '未通过'}</span>
          </div>
        `).join('')}
    </div>`;
  },

  renderHistory(el) {
    this.setActiveTab('profile');
    document.getElementById('page-title').textContent = '学习记录';
    const p = this.state.progress;
    const completed = Object.entries(p).filter(([k,v]) => v.completed).map(([k,v]) => {
      const course = DATA.courses.find(c => c.id === k);
      return { ...v, course };
    }).sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));

    el.innerHTML = `<div class="animate-fade-in">
      <button onclick="location.hash='#profile'" class="flex items-center gap-1 text-sm text-gray-500 hover:text-brand-600 mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        返回个人中心
      </button>
      ${completed.length === 0 ? '<div class="text-center text-gray-400 py-16">暂无学习记录</div>' :
        completed.map(r => `
          <div class="card mb-3 flex items-center gap-3">
            <div class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center">✅</div>
            <div class="flex-1">
              <div class="font-medium text-sm">${r.course?.title || '未知课程'}</div>
              <div class="text-xs text-gray-400">${r.course?.productLineName || ''} · ${new Date(r.completedAt).toLocaleDateString('zh-CN')}</div>
            </div>
          </div>
        `).join('')}
    </div>`;
  },

  // ─── FALLBACKS ──────────────────────────────────────
  renderExamFallback(el) { el.innerHTML = '<div class="text-center text-gray-400 py-16">考试模块加载中...</div>'; },
  renderAdminFallback(el) { el.innerHTML = '<div class="text-center text-gray-400 py-16">管理后台加载中...</div>'; },

  // ─── UI UTILS ───────────────────────────────────────
  toast(msg, duration = 2500) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  },
  showModal(html) {
    const overlay = document.getElementById('modal-overlay');
    const content = document.getElementById('modal-content');
    if (!overlay || !content) return;
    content.innerHTML = html;
    overlay.classList.remove('hidden');
    overlay.classList.add('show');
    overlay.addEventListener('click', (e) => { if (e.target === overlay) this.closeModal(); });
  },
  closeModal() {
    const overlay = document.getElementById('modal-overlay');
    if (overlay) { overlay.classList.remove('show'); overlay.classList.add('hidden'); }
  },
  getContentContainer() {
    return document.getElementById('app-content');
  },

  exportMyProgress() {
    const u = this.state.user;
    if (!u) return this.toast('请先登录');
    const progress = this.state.progress;
    const quizResults = JSON.parse(localStorage.getItem('atc_quiz_results_' + u.phone) || '[]');
    const examHistory = JSON.parse(localStorage.getItem('exam_history') || '[]');
    const completedCourses = Object.keys(progress).filter(k => progress[k].completed).map(k => {
      const course = DATA.courses.find(c => c.id === k);
      return { courseId: k, courseName: course ? course.title : k, completedAt: progress[k].completedAt };
    });
    const snapshot = {
      type: 'atc_progress_report',
      version: 1,
      exportDate: new Date().toISOString(),
      user: { name: u.name, company: u.company, phone: u.phone, role: u.role, createdAt: u.createdAt },
      summary: {
        totalCourses: DATA.courses.length,
        completedCourses: completedCourses.length,
        completionRate: DATA.courses.length ? Math.round(completedCourses.length / DATA.courses.length * 100) : 0,
        quizAttempts: quizResults.length,
        avgQuizScore: quizResults.length ? Math.round(quizResults.reduce((s, q) => s + q.score, 0) / quizResults.length) : 0,
        examAttempts: examHistory.length,
        avgExamScore: examHistory.length ? Math.round(examHistory.reduce((s, e) => s + e.score, 0) / examHistory.length) : 0
      },
      completedCourses,
      quizResults,
      examHistory
    };
    const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `学习进度_${u.name}_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    this.toast('学习进度已导出，可发送给管理者');
  }
};

</script>
  <script>
/**
 * 广告特训营 - 考试引擎模块
 * 管理考试系统：试卷生成、答题、计时、评分、历史记录
 */

(function () {
  'use strict';

  // ========== 试卷定义 ==========
  const EXAM_PAPERS = [
    {
      id: 'exam-xg-basic',
      name: '效广基础考核',
      duration: 30,
      passScore: 80,
      totalScore: 100,
      rules: [
        { productLines: ['cpc', 'ocpc-gmv', 'ocpc-leads', 'dual'], count: 25 },
        { productLines: ['nobid', 'allpush'], count: 5 }
      ]
    },
    {
      id: 'exam-xg-adv',
      name: '效广进阶考核',
      duration: 40,
      passScore: 80,
      totalScore: 100,
      rules: [
        { productLines: ['nobid', 'allpush', 'ocpc-gmv', 'ocpc-leads'], count: 20 },
        { productLines: ['dual', 'cpc'], count: 10 }
      ]
    },
    {
      id: 'exam-pg-basic',
      name: '品广基础考核',
      duration: 25,
      passScore: 80,
      totalScore: 100,
      rules: [
        { productLines: ['topdisplay'], count: 15 },
        { productLines: ['watercard'], count: 10 }
      ]
    },
    {
      id: 'exam-agent',
      name: '品牌智能体考核',
      duration: 20,
      passScore: 80,
      totalScore: 100,
      rules: [
        { productLines: ['ai-agent'], count: 20 }
      ]
    },
    {
      id: 'exam-comprehensive',
      name: '综合上岗考核',
      duration: 60,
      passScore: 85,
      totalScore: 100,
      rules: [
        { productLines: ['cpc', 'ocpc-gmv', 'ocpc-leads', 'dual', 'nobid', 'allpush'], count: 20 },
        { productLines: ['topdisplay', 'watercard'], count: 15 },
        { productLines: ['ai-agent'], count: 15 }
      ]
    },
    {
      id: 'exam-monthly',
      name: '月度复考',
      duration: 20,
      passScore: 80,
      totalScore: 100,
      rules: [
        { productLines: ['cpc', 'ocpc-gmv', 'ocpc-leads', 'dual', 'nobid', 'allpush', 'topdisplay', 'watercard', 'ai-agent'], count: 20 }
      ]
    }
  ];

  // ========== 工具函数 ==========

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getQuestions() {
    return (window.DATA && window.DATA.questions) || [];
  }

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem('exam_history')) || [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(history) {
    localStorage.setItem('exam_history', JSON.stringify(history));
  }

  function getSavedState() {
    try {
      return JSON.parse(localStorage.getItem('exam_current'));
    } catch (e) {
      return null;
    }
  }

  function saveCurrentState(state) {
    localStorage.setItem('exam_current', JSON.stringify(state));
  }

  function clearCurrentState() {
    localStorage.removeItem('exam_current');
  }

  function getPaperStatus(paperId) {
    const history = getHistory();
    const attempts = history.filter(h => h.paperId === paperId);
    if (attempts.length === 0) {
      const saved = getSavedState();
      if (saved && saved.paper && saved.paper.id === paperId) return 'in_progress';
      return 'not_taken';
    }
    const last = attempts[attempts.length - 1];
    return last.passed ? 'passed' : 'failed';
  }

  function getStatusBadge(status) {
    switch (status) {
      case 'passed': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded-full bg-green-100 text-green-700">已通过</span>';
      case 'failed': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded-full bg-red-100 text-red-700">未通过</span>';
      case 'in_progress': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-700">进行中</span>';
      default: return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded-full bg-gray-100 text-gray-500">未参加</span>';
    }
  }

  function getTypeBadge(type) {
    switch (type) {
      case 'single': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded bg-blue-100 text-blue-700">单选题</span>';
      case 'multi': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded bg-purple-100 text-purple-700">多选题</span>';
      case 'judge': return '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded bg-yellow-100 text-yellow-700">判断题</span>';
      default: return '';
    }
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function getQuestionCount(paper) {
    return paper.rules.reduce((sum, r) => sum + r.count, 0);
  }

  // ========== 试卷生成 ==========

  function generatePaper(paperId) {
    const paper = EXAM_PAPERS.find(p => p.id === paperId);
    if (!paper) return null;

    const allQuestions = getQuestions();
    let selectedQuestions = [];

    for (const rule of paper.rules) {
      const pool = allQuestions.filter(q => rule.productLines.includes(q.productLine));
      const shuffled = shuffleArray(pool);
      const picked = shuffled.slice(0, rule.count);
      selectedQuestions = selectedQuestions.concat(picked);
    }

    // Shuffle final question order
    selectedQuestions = shuffleArray(selectedQuestions);

    // Shuffle options for each question (track new answer indices)
    const questions = selectedQuestions.map(q => {
      const optionIndices = q.options.map((_, i) => i);
      const shuffledIndices = shuffleArray(optionIndices);
      const shuffledOptions = shuffledIndices.map(i => q.options[i]);

      // Remap answer(s)
      let newAnswer;
      if (q.type === 'multi') {
        const answerArr = Array.isArray(q.answer) ? q.answer : [q.answer];
        newAnswer = answerArr.map(a => shuffledIndices.indexOf(a));
      } else {
        newAnswer = shuffledIndices.indexOf(q.answer);
      }

      return {
        id: q.id,
        productLine: q.productLine,
        knowledgeType: q.knowledgeType,
        difficulty: q.difficulty,
        type: q.type,
        question: q.question,
        options: shuffledOptions,
        answer: newAnswer,
        explanation: q.explanation
      };
    });

    const questionOrder = questions.map((_, i) => i);

    return { paper, questions, questionOrder };
  }

  // ========== 计时器 ==========

  let timerInterval = null;

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function () {
      updateTimer();
    }, 1000);
  }

  function updateTimer() {
    if (!examState) return;
    examState.timeRemaining--;

    if (examState.timeRemaining <= 0) {
      examState.timeRemaining = 0;
      endTimer();
      submitExam();
      return;
    }

    const timerEl = document.getElementById('exam-timer');
    if (timerEl) {
      timerEl.textContent = formatTime(examState.timeRemaining);
      if (examState.timeRemaining <= 300) {
        timerEl.classList.add('text-red-600', 'font-bold');
        if (examState.timeRemaining === 300) {
          showToast('⚠️ 剩余时间不足5分钟，请尽快完成！');
        }
      }
    }
  }

  function endTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // ========== 屏幕切换检测 ==========

  let visibilityHandler = null;

  function initScreenDetection() {
    if (visibilityHandler) {
      document.removeEventListener('visibilitychange', visibilityHandler);
    }
    visibilityHandler = function () {
      if (!examState) return;
      if (document.hidden) {
        examState.screenSwitches = (examState.screenSwitches || 0) + 1;
        saveCurrentState(examState);
        if (examState.screenSwitches >= 3) {
          showToast('检测到多次切屏，系统已自动交卷！');
          submitExam();
          return;
        }
        showToast('⚠️ 检测到屏幕切换（' + examState.screenSwitches + '/3），超过3次将自动交卷');
      }
    };
    document.addEventListener('visibilitychange', visibilityHandler);
  }

  function removeScreenDetection() {
    if (visibilityHandler) {
      document.removeEventListener('visibilitychange', visibilityHandler);
      visibilityHandler = null;
    }
  }

  // ========== Toast 提示 ==========

  function showToast(message) {
    let toast = document.getElementById('exam-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'exam-toast';
      toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-gray-900 text-white text-sm rounded-lg shadow-lg transition-opacity duration-300';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(function () {
      toast.style.opacity = '0';
    }, 3000);
  }

  // ========== 考试状态 ==========

  let examState = null;

  // ========== 渲染：考试列表 ==========

  function renderList(container) {
    const history = getHistory();
    let html = '<div class="space-y-4">';
    html += '<h2 class="text-xl font-bold text-gray-800 mb-4">考试中心</h2>';

    for (const paper of EXAM_PAPERS) {
      const status = getPaperStatus(paper.id);
      const qCount = getQuestionCount(paper);
      const attempts = history.filter(h => h.paperId === paper.id);

      html += '<div class="bg-white rounded-xl p-4 border border-gray-200">';
      html += '<div class="flex items-start justify-between mb-2">';
      html += '<h3 class="text-base font-semibold text-gray-800">' + paper.name + '</h3>';
      html += getStatusBadge(status);
      html += '</div>';
      html += '<div class="flex flex-wrap gap-3 text-xs text-gray-500 mb-3">';
      html += '<span>⏱ 时长 ' + paper.duration + ' 分钟</span>';
      html += '<span>📝 共 ' + qCount + ' 题</span>';
      html += '<span>✅ ' + paper.passScore + ' 分及格</span>';
      html += '<span>📊 满分 ' + paper.totalScore + ' 分</span>';
      html += '</div>';

      if (attempts.length > 0) {
        const best = Math.max(...attempts.map(a => a.score));
        html += '<div class="text-xs text-gray-400 mb-3">历史最高分: <span class="font-medium text-gray-600">' + best + '分</span>（共' + attempts.length + '次）</div>';
      }

      if (status === 'in_progress') {
        html += '<button onclick="window.Exam.resumeExam()" class="w-full py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">继续考试</button>';
      } else {
        html += '<button onclick="window.Exam.startExam(\'' + paper.id + '\')" class="w-full py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">开始考试</button>';
      }

      html += '</div>';
    }

    html += '</div>';
    container.innerHTML = html;
  }

  // ========== 开始考试 ==========

  function startExam(paperId) {
    const result = generatePaper(paperId);
    if (!result) {
      showToast('试卷生成失败，请检查题库数据');
      return;
    }

    examState = {
      paper: result.paper,
      questions: result.questions,
      questionOrder: result.questionOrder,
      answers: new Array(result.questions.length).fill(null),
      flags: new Array(result.questions.length).fill(false),
      currentIndex: 0,
      timeRemaining: result.paper.duration * 60,
      screenSwitches: 0,
      startTime: Date.now()
    };

    saveCurrentState(examState);
    renderExamPage();
  }

  // ========== 恢复考试 ==========

  function resumeExam() {
    const saved = getSavedState();
    if (!saved) {
      showToast('没有找到未完成的考试');
      return;
    }

    if (confirm('发现未完成的考试【' + saved.paper.name + '】，是否继续？\n剩余时间：' + formatTime(saved.timeRemaining))) {
      examState = saved;
      renderExamPage();
    } else {
      clearCurrentState();
    }
  }

  // ========== 渲染考试页面 ==========

  function renderExamPage() {
    const app = window.App;
    const container = app ? app.getContentContainer() : document.getElementById('app-content');
    if (!container) return;

    let html = '';

    // 顶部计时栏
    html += '<div id="exam-top-bar" class="sticky top-0 z-40 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">';
    html += '<div class="flex items-center gap-3">';
    html += '<span id="exam-timer" class="text-lg font-mono font-semibold text-gray-800">' + formatTime(examState.timeRemaining) + '</span>';
    html += '<span class="text-xs text-gray-500" id="exam-progress">第 ' + (examState.currentIndex + 1) + '/' + examState.questions.length + ' 题</span>';
    html += '</div>';
    html += '<button onclick="window.Exam.submitExam()" class="px-4 py-1.5 bg-red-500 text-white text-sm font-medium rounded-lg hover:bg-red-600 transition-colors">交卷</button>';
    html += '</div>';

    // 题目区域
    html += '<div id="exam-question-area" class="px-4 py-4 min-h-[400px]"></div>';

    // 底部操作栏
    html += '<div class="sticky bottom-0 bg-white border-t border-gray-200 px-4 py-3 flex items-center justify-between">';
    html += '<button onclick="window.Exam.prevQuestion()" id="btn-prev" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors disabled:opacity-40">上一题</button>';
    html += '<div class="flex gap-2">';
    html += '<button onclick="window.Exam.flagQuestion(' + examState.currentIndex + ')" id="btn-flag" class="px-3 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition-colors">标记</button>';
    html += '<button onclick="window.Exam.toggleAnswerCard()" class="px-3 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition-colors">答题卡</button>';
    html += '</div>';
    html += '<button onclick="window.Exam.nextQuestion()" id="btn-next" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">下一题</button>';
    html += '</div>';

    // 答题卡（默认隐藏）
    html += '<div id="exam-answer-card" class="hidden px-4 py-4 bg-gray-50 border-t border-gray-200"></div>';

    container.innerHTML = html;

    renderQuestion();
    startTimer();
    initScreenDetection();
  }

  // ========== 渲染当前题目 ==========

  function renderQuestion() {
    const area = document.getElementById('exam-question-area');
    if (!area || !examState) return;

    const idx = examState.currentIndex;
    const q = examState.questions[idx];
    const userAnswer = examState.answers[idx];
    const isFlagged = examState.flags[idx];

    let html = '';

    // 题号 + 类型 + 标记
    html += '<div class="flex items-center gap-2 mb-3">';
    html += '<span class="text-sm font-medium text-gray-500">第 ' + (idx + 1) + ' 题</span>';
    html += getTypeBadge(q.type);
    if (isFlagged) {
      html += '<span class="inline-block px-2 py-0.5 text-xs font-medium rounded bg-orange-100 text-orange-700">已标记</span>';
    }
    html += '</div>';

    // 题目
    html += '<p class="text-base font-medium text-gray-800 mb-4 leading-relaxed">' + q.question + '</p>';

    // 多选提示
    if (q.type === 'multi') {
      html += '<p class="text-xs text-purple-600 mb-3">（多选题，请选择所有正确答案后点击"确认选择"）</p>';
    }

    // 选项
    html += '<div class="space-y-2" id="exam-options">';
    const selectedAnswers = q.type === 'multi'
      ? (Array.isArray(userAnswer) ? userAnswer : [])
      : (userAnswer !== null ? [userAnswer] : []);

    for (let i = 0; i < q.options.length; i++) {
      const isSelected = selectedAnswers.includes(i);
      const selectClass = isSelected
        ? 'border-indigo-500 bg-indigo-50 ring-1 ring-indigo-500'
        : 'border-gray-200 bg-white hover:border-gray-300';

      if (q.type === 'multi') {
        html += '<label class="quiz-option flex items-center gap-3 p-3 rounded-lg border cursor-pointer transition-all ' + selectClass + '" data-index="' + i + '">';
        html += '<input type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500" ' + (isSelected ? 'checked' : '') + ' onchange="window.Exam.toggleMultiOption(' + i + ')">';
        html += '<span class="text-sm text-gray-700">' + String.fromCharCode(65 + i) + '. ' + q.options[i] + '</span>';
        html += '</label>';
      } else {
        html += '<div class="quiz-option p-3 rounded-lg border cursor-pointer transition-all ' + selectClass + '" onclick="window.Exam.selectAnswer(' + idx + ',' + i + ')">';
        html += '<span class="text-sm text-gray-700">' + String.fromCharCode(65 + i) + '. ' + q.options[i] + '</span>';
        html += '</div>';
      }
    }
    html += '</div>';

    // 多选确认按钮
    if (q.type === 'multi') {
      html += '<button onclick="window.Exam.confirmMultiAnswer()" class="mt-4 w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">确认选择</button>';
    }

    area.innerHTML = html;

    // 更新进度和按钮状态
    updateNavButtons();
    updateProgress();
  }

  function updateNavButtons() {
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const flagBtn = document.getElementById('btn-flag');

    if (prevBtn) prevBtn.disabled = examState.currentIndex === 0;
    if (nextBtn) nextBtn.disabled = examState.currentIndex === examState.questions.length - 1;
    if (flagBtn) {
      flagBtn.textContent = examState.flags[examState.currentIndex] ? '取消标记' : '标记';
      flagBtn.className = examState.flags[examState.currentIndex]
        ? 'px-3 py-2 bg-orange-100 text-orange-700 text-sm rounded-lg hover:bg-orange-200 transition-colors'
        : 'px-3 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition-colors';
    }
  }

  function updateProgress() {
    const el = document.getElementById('exam-progress');
    if (el) {
      el.textContent = '第 ' + (examState.currentIndex + 1) + '/' + examState.questions.length + ' 题';
    }
  }

  // ========== 答题操作 ==========

  function selectAnswer(questionIndex, answer) {
    if (!examState) return;
    examState.answers[questionIndex] = answer;
    saveCurrentState(examState);
    renderQuestion();
  }

  // 多选临时切换（不立即保存，等确认）
  let tempMultiSelection = [];

  function toggleMultiOption(optIndex) {
    const idx = examState.currentIndex;
    let current = Array.isArray(examState.answers[idx]) ? examState.answers[idx].slice() : [];

    const pos = current.indexOf(optIndex);
    if (pos >= 0) {
      current.splice(pos, 1);
    } else {
      current.push(optIndex);
    }

    examState.answers[idx] = current.sort();
    renderQuestion();
  }

  function confirmMultiAnswer() {
    if (!examState) return;
    const idx = examState.currentIndex;
    const answer = examState.answers[idx];
    if (!Array.isArray(answer) || answer.length === 0) {
      showToast('请至少选择一个答案');
      return;
    }
    saveCurrentState(examState);
    showToast('已确认选择');
    // 自动跳下一题
    if (idx < examState.questions.length - 1) {
      nextQuestion();
    }
  }

  // ========== 导航 ==========

  function nextQuestion() {
    if (!examState || examState.currentIndex >= examState.questions.length - 1) return;
    examState.currentIndex++;
    saveCurrentState(examState);
    renderQuestion();
  }

  function prevQuestion() {
    if (!examState || examState.currentIndex <= 0) return;
    examState.currentIndex--;
    saveCurrentState(examState);
    renderQuestion();
  }

  function goToQuestion(index) {
    if (!examState || index < 0 || index >= examState.questions.length) return;
    examState.currentIndex = index;
    saveCurrentState(examState);
    renderQuestion();
  }

  function flagQuestion(index) {
    if (!examState) return;
    examState.flags[index] = !examState.flags[index];
    saveCurrentState(examState);
    renderQuestion();
    // 更新答题卡（如果打开的话）
    const card = document.getElementById('exam-answer-card');
    if (card && !card.classList.contains('hidden')) {
      renderAnswerCard();
    }
  }

  // ========== 答题卡 ==========

  function toggleAnswerCard() {
    const card = document.getElementById('exam-answer-card');
    if (!card) return;
    if (card.classList.contains('hidden')) {
      card.classList.remove('hidden');
      renderAnswerCard();
    } else {
      card.classList.add('hidden');
    }
  }

  function renderAnswerCard() {
    const card = document.getElementById('exam-answer-card');
    if (!card || !examState) return;

    const cols = 5;
    const total = examState.questions.length;

    let html = '<div class="mb-2 flex items-center justify-between">';
    html += '<span class="text-sm font-medium text-gray-600">答题卡</span>';
    html += '<div class="flex gap-3 text-xs text-gray-400">';
    html += '<span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-indigo-500"></span>已答</span>';
    html += '<span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-orange-400"></span>标记</span>';
    html += '<span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-full bg-gray-300"></span>未答</span>';
    html += '</div></div>';

    html += '<div class="grid gap-2" style="grid-template-columns: repeat(' + cols + ', 1fr);">';

    for (let i = 0; i < total; i++) {
      const answered = examState.answers[i] !== null;
      const flagged = examState.flags[i];
      const isCurrent = i === examState.currentIndex;

      let bgClass = 'bg-gray-200 text-gray-600';
      if (flagged) bgClass = 'bg-orange-400 text-white';
      else if (answered) bgClass = 'bg-indigo-500 text-white';

      if (isCurrent) bgClass += ' ring-2 ring-indigo-300 ring-offset-1';

      html += '<button onclick="window.Exam.goToQuestion(' + i + ')" class="w-full aspect-square rounded-full flex items-center justify-center text-xs font-medium transition-all ' + bgClass + '">';
      html += (i + 1);
      html += '</button>';
    }

    html += '</div>';

    // 统计
    const answeredCount = examState.answers.filter(a => a !== null).length;
    const flaggedCount = examState.flags.filter(f => f).length;
    html += '<div class="mt-3 text-xs text-gray-500 text-center">已答 ' + answeredCount + ' 题 / 标记 ' + flaggedCount + ' 题 / 共 ' + total + ' 题</div>';

    card.innerHTML = html;
  }

  // ========== 提交考试 ==========

  function submitExam() {
    if (!examState) return;

    // 确认（如果不是超时自动交卷）
    const unanswered = examState.answers.filter(a => a === null).length;
    if (examState.timeRemaining > 0 && unanswered > 0) {
      if (!confirm('还有 ' + unanswered + ' 题未作答，确定要交卷吗？')) {
        return;
      }
    } else if (examState.timeRemaining > 0) {
      if (!confirm('确定要交卷吗？')) {
        return;
      }
    }

    endTimer();
    removeScreenDetection();

    // 评分
    const totalQuestions = examState.questions.length;
    const pointsPerQuestion = examState.paper.totalScore / totalQuestions;
    let totalScore = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let unansweredCount = 0;
    const details = [];

    for (let i = 0; i < totalQuestions; i++) {
      const q = examState.questions[i];
      const userAnswer = examState.answers[i];
      let earned = 0;
      let status = 'unanswered';

      if (userAnswer === null) {
        status = 'unanswered';
        unansweredCount++;
      } else if (q.type === 'multi') {
        const correctArr = Array.isArray(q.answer) ? q.answer.slice().sort() : [q.answer];
        const userArr = Array.isArray(userAnswer) ? userAnswer.slice().sort() : [userAnswer];

        const isExactMatch = correctArr.length === userArr.length && correctArr.every((v, idx) => v === userArr[idx]);
        const hasWrong = userArr.some(a => !correctArr.includes(a));

        if (isExactMatch) {
          earned = pointsPerQuestion;
          status = 'correct';
          correctCount++;
        } else if (hasWrong) {
          earned = 0;
          status = 'wrong';
          wrongCount++;
        } else {
          // 少选 - 半分
          earned = pointsPerQuestion / 2;
          status = 'partial';
          wrongCount++;
        }
      } else {
        // single / judge
        if (userAnswer === q.answer) {
          earned = pointsPerQuestion;
          status = 'correct';
          correctCount++;
        } else {
          earned = 0;
          status = 'wrong';
          wrongCount++;
        }
      }

      totalScore += earned;

      details.push({
        index: i,
        question: q,
        userAnswer: userAnswer,
        correct: status === 'correct',
        status: status,
        earned: earned,
        points: pointsPerQuestion
      });
    }

    totalScore = Math.round(totalScore * 100) / 100;
    const passed = totalScore >= examState.paper.passScore;
    const timeUsed = examState.paper.duration * 60 - examState.timeRemaining;

    const result = {
      paperId: examState.paper.id,
      paperName: examState.paper.name,
      score: totalScore,
      totalScore: examState.paper.totalScore,
      passScore: examState.paper.passScore,
      passed: passed,
      correctCount: correctCount,
      wrongCount: wrongCount,
      unansweredCount: unansweredCount,
      totalQuestions: totalQuestions,
      timeUsed: timeUsed,
      screenSwitches: examState.screenSwitches,
      details: details,
      date: new Date().toISOString(),
      userPhone: (window.App && App.state.user) ? App.state.user.phone : ''
    };

    // 保存历史
    const history = getHistory();
    history.push(result);
    saveHistory(history);
    if (window.FirebaseSync && result.userPhone) {
      FirebaseSync.syncExamResult(result.userPhone, result);
    }
    clearCurrentState();
    examState = null;

    renderResults(result);
  }

  // ========== 渲染结果页面 ==========

  function renderResults(result) {
    const app = window.App;
    const container = app ? app.getContentContainer() : document.getElementById('app-content');
    if (!container) return;

    const scoreColor = result.passed ? 'text-green-600' : 'text-red-600';
    const passLabel = result.passed ? '恭喜通过' : '未通过';
    const passBg = result.passed ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200';

    let html = '';

    // 分数展示
    html += '<div class="text-center py-8 ' + passBg + ' border rounded-xl mx-4 mt-4">';
    html += '<div class="text-6xl font-bold ' + scoreColor + '">' + result.score + '</div>';
    html += '<div class="text-sm text-gray-500 mt-1">满分 ' + result.totalScore + ' 分</div>';
    html += '<div class="mt-2 inline-block px-4 py-1 rounded-full text-sm font-medium ' + (result.passed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700') + '">' + passLabel + '</div>';
    html += '</div>';

    // 统计
    html += '<div class="grid grid-cols-4 gap-2 px-4 mt-4">';
    html += '<div class="text-center p-3 bg-white rounded-lg border border-gray-200">';
    html += '<div class="text-lg font-bold text-green-600">' + result.correctCount + '</div>';
    html += '<div class="text-xs text-gray-500">正确</div></div>';
    html += '<div class="text-center p-3 bg-white rounded-lg border border-gray-200">';
    html += '<div class="text-lg font-bold text-red-600">' + result.wrongCount + '</div>';
    html += '<div class="text-xs text-gray-500">错误</div></div>';
    html += '<div class="text-center p-3 bg-white rounded-lg border border-gray-200">';
    html += '<div class="text-lg font-bold text-gray-400">' + result.unansweredCount + '</div>';
    html += '<div class="text-xs text-gray-500">未答</div></div>';
    html += '<div class="text-center p-3 bg-white rounded-lg border border-gray-200">';
    html += '<div class="text-lg font-bold text-indigo-600">' + formatTime(result.timeUsed) + '</div>';
    html += '<div class="text-xs text-gray-500">用时</div></div>';
    html += '</div>';

    if (result.screenSwitches > 0) {
      html += '<div class="mx-4 mt-3 text-xs text-orange-600 text-center">⚠️ 本次考试切屏 ' + result.screenSwitches + ' 次</div>';
    }

    // 题目回顾
    html += '<div class="px-4 mt-6 mb-4">';
    html += '<h3 class="text-base font-semibold text-gray-800 mb-3">答题回顾</h3>';

    for (let i = 0; i < result.details.length; i++) {
      const d = result.details[i];
      const q = d.question;
      let statusIcon, statusText, statusClass;

      if (d.status === 'correct') {
        statusIcon = '✅'; statusText = '正确'; statusClass = 'border-green-200';
      } else if (d.status === 'partial') {
        statusIcon = '🟡'; statusText = '部分正确（少选）'; statusClass = 'border-yellow-200';
      } else if (d.status === 'wrong') {
        statusIcon = '❌'; statusText = '错误'; statusClass = 'border-red-200';
      } else {
        statusIcon = '⬜'; statusText = '未作答'; statusClass = 'border-gray-200';
      }

      html += '<div class="mb-3 p-3 bg-white rounded-lg border ' + statusClass + '">';
      html += '<div class="flex items-start gap-2 mb-2">';
      html += '<span>' + statusIcon + '</span>';
      html += '<div class="flex-1">';
      html += '<div class="flex items-center gap-2 mb-1">';
      html += '<span class="text-xs text-gray-400">第' + (i + 1) + '题</span>';
      html += getTypeBadge(q.type);
      html += '<span class="text-xs text-gray-400 ml-auto">' + statusText + '（' + d.earned.toFixed(1) + '/' + d.points.toFixed(1) + '分）</span>';
      html += '</div>';
      html += '<p class="text-sm text-gray-700 mb-2">' + q.question + '</p>';

      // 显示选项
      const correctAnswer = q.type === 'multi' ? (Array.isArray(q.answer) ? q.answer : [q.answer]) : [q.answer];
      const userAnswerArr = d.userAnswer !== null
        ? (q.type === 'multi' ? (Array.isArray(d.userAnswer) ? d.userAnswer : [d.userAnswer]) : [d.userAnswer])
        : [];

      for (let j = 0; j < q.options.length; j++) {
        const isCorrect = correctAnswer.includes(j);
        const isUserSelected = userAnswerArr.includes(j);
        let optClass = 'text-gray-600';
        let optIcon = '';

        if (isCorrect && isUserSelected) {
          optClass = 'text-green-700 font-medium';
          optIcon = ' ✅';
        } else if (isCorrect && !isUserSelected) {
          optClass = 'text-green-600';
          optIcon = ' ← 正确答案';
        } else if (!isCorrect && isUserSelected) {
          optClass = 'text-red-600 line-through';
          optIcon = ' ✗';
        }

        html += '<div class="text-xs ' + optClass + ' py-0.5">' + String.fromCharCode(65 + j) + '. ' + q.options[j] + optIcon + '</div>';
      }

      // 解析
      if (q.explanation) {
        html += '<div class="mt-2 p-2 bg-blue-50 rounded text-xs text-blue-700 leading-relaxed">💡 ' + q.explanation + '</div>';
      }

      html += '</div></div></div>';
    }

    html += '</div>';

    // 操作按钮
    html += '<div class="px-4 pb-8 flex gap-3">';
    html += '<button onclick="window.App && window.App.navigate(\'exam\')" class="flex-1 py-3 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">返回首页</button>';
    html += '<button onclick="window.Exam.startExam(\'' + result.paperId + '\')" class="flex-1 py-3 bg-white border border-indigo-600 text-indigo-600 text-sm font-medium rounded-lg hover:bg-indigo-50 transition-colors">再考一次</button>';
    html += '</div>';

    container.innerHTML = html;
    container.scrollTop = 0;
  }

  // ========== 历史记录 ==========

  // getHistory already defined above

  // ========== 暴露到 window.Exam ==========

  window.Exam = {
    papers: EXAM_PAPERS,
    generatePaper: generatePaper,
    renderList: renderList,
    startExam: startExam,
    renderQuestion: renderQuestion,
    selectAnswer: selectAnswer,
    toggleMultiOption: toggleMultiOption,
    confirmMultiAnswer: confirmMultiAnswer,
    nextQuestion: nextQuestion,
    prevQuestion: prevQuestion,
    goToQuestion: goToQuestion,
    flagQuestion: flagQuestion,
    submitExam: submitExam,
    renderResults: renderResults,
    renderAnswerCard: renderAnswerCard,
    toggleAnswerCard: toggleAnswerCard,
    startTimer: startTimer,
    updateTimer: updateTimer,
    endTimer: endTimer,
    initScreenDetection: initScreenDetection,
    getHistory: getHistory,
    resumeExam: resumeExam
  };

})();

</script>
  <script>
/* 广告特训营 - Admin Panel (权限隔离版) */

window.Admin = {
  _companyFilter: null, // null = all (super_admin), string = specific company

  render(container) {
    App.setActiveTab('admin');
    document.getElementById('page-title').textContent = '管理后台';
    const user = App.state.user;

    // Permission check: only sp_admin and super_admin can access
    if (!user || (user.loginType !== 'access_code' && user.loginType !== 'super_admin')) {
      container.innerHTML = `
        <div class="animate-fade-in flex items-center justify-center min-h-[60vh]">
          <div class="w-full max-w-sm mx-auto">
            <div class="card text-center !p-8">
              <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
              </div>
              <h3 class="text-lg font-bold text-gray-900 mb-1">无访问权限</h3>
              <p class="text-sm text-gray-400 mb-4">管理后台仅对服务商管理员和超级管理员开放</p>
              <p class="text-xs text-gray-400 mb-6">请使用管理员访问码或超级管理密码登录</p>
              <button onclick="location.hash='#home'" class="w-full py-3 bg-brand-600 text-white rounded-xl font-medium hover:bg-brand-700 transition-colors">返回首页</button>
            </div>
          </div>
        </div>`;
      return;
    }

    // Show loading while fetching from Firestore
    container.innerHTML = `<div class="animate-fade-in flex items-center justify-center min-h-[40vh]">
      <div class="text-center">
        <div class="w-10 h-10 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mx-auto mb-3"></div>
        <div class="text-sm text-gray-500">正在同步数据...</div>
      </div>
    </div>`;

    // Fetch from Firestore then render
    this._fetchAndRender(container);
  },

  async _fetchAndRender(container) {
    // Fetch cloud data and merge to localStorage
    if (typeof FirebaseSync !== 'undefined' && FirebaseSync._ready) {
      try {
        const companyFilter = this._isSuperAdmin() ? (this._companyFilter || null) : this._getCompany();
        const cloudData = await FirebaseSync.fetchAllData(companyFilter);
        FirebaseSync.mergeToLocal(cloudData);
      } catch (e) {
        console.warn('[Admin] Firestore fetch failed:', e.message);
      }
    }
    this._renderPanel(container);
  },

  _isSuperAdmin() { return App.state.user && App.state.user.loginType === 'super_admin'; },
  _getCompany() { return App.state.user ? App.state.user.company : ''; },

  _getFilteredUsers() {
    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    if (this._isSuperAdmin()) {
      if (this._companyFilter) return allUsers.filter(u => u.company === this._companyFilter);
      return allUsers;
    }
    // sp_admin: only their company
    return allUsers.filter(u => u.company === this._getCompany());
  },

  _renderPanel(container) {
    const users = this._getFilteredUsers();
    const isSuper = this._isSuperAdmin();

      <!-- Stats -->

        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-brand-600">${totalUsers}</div>
          <div class="text-xs text-gray-400 mt-1">注册用户</div>
        </div>
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-blue-600">${activeUsers}</div>
          <div class="text-xs text-gray-400 mt-1">已学习</div>
        </div>
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-green-600">${allDone}</div>
          <div class="text-xs text-gray-400 mt-1">全部完成</div>
        </div>

          <div class="text-3xl font-bold ${avgRate >= 80 ? 'text-green-600' : avgRate >= 50 ? 'text-orange-500' : 'text-gray-500'}">${avgRate}%</div>
          <div class="text-xs text-gray-400 mt-1">平均完成率</div>

      </div>

      <!-- Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="Admin.showTab('users')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-brand-600 text-white whitespace-nowrap" data-tab="users">小二管理</button>
        <button onclick="Admin.showTab('plan')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 whitespace-nowrap" data-tab="plan">课程计划</button>
        <button onclick="Admin.showTab('progress')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 whitespace-nowrap" data-tab="progress">学习进度</button>
        <button onclick="Admin.showTab('exams')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 whitespace-nowrap" data-tab="exams">考试数据</button>
        <button onclick="Admin.showTab('export')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600 whitespace-nowrap" data-tab="export">数据导出</button>
      </div>

      <div id="admin-tab-content"></div>
    </div>`;

    this.showTab('users');
  },

  showTab(tab) {
    document.querySelectorAll('.admin-tab').forEach(b => {
      b.classList.toggle('bg-brand-600', b.dataset.tab === tab);
      b.classList.toggle('text-white', b.dataset.tab === tab);
      b.classList.toggle('bg-gray-100', b.dataset.tab !== tab);
      b.classList.toggle('text-gray-600', b.dataset.tab !== tab);
    });
    const el = document.getElementById('admin-tab-content');
    switch(tab) {
      case 'users': this.renderUsersTab(el); break;
      case 'plan': this.renderPlanTab(el); break;
      case 'progress': this.renderProgressTab(el); break;
      case 'exams': this.renderExamsTab(el); break;
      case 'export': this.renderExportTab(el); break;
    }

  // ─── 小二管理 ─────────────────────────────
  renderUsersTab(el) {
    const users = this._getFilteredUsers();
    const byCompany = {};
    users.forEach(u => {
      if (!byCompany[u.company]) byCompany[u.company] = [];
      byCompany[u.company].push(u);
    });

    el.innerHTML = `<div class="space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-500">共 ${users.length} 名用户</span>
      </div>
      ${Object.entries(byCompany).map(([company, cUsers]) => `
        <div class="card">
          <div class="font-semibold text-gray-900 mb-2">${company}</div>
          <div class="text-xs text-gray-400 mb-3">${cUsers.length}人</div>
          ${cUsers.map(u => {
            const planCount = (u.coursePlan || []).length;
            const prog = u.progress || {};
            const rate = prog.completionRate || 0;
            return `<div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
              <div class="w-8 h-8 bg-brand-50 rounded-full flex items-center justify-center text-sm font-medium text-brand-700">${(u.name || '?')[0]}</div>
              <div class="flex-1">
                <div class="text-sm font-medium">${u.name || '未知'}</div>
                <div class="text-xs text-gray-400">${u.phone || ''} · ${App.roleName(u.role)}${planCount ? ' · 已分配' + planCount + '门课' : ''}</div>
              </div>
              <div class="text-right">
                <div class="text-xs font-bold ${rate >= 100 ? 'text-green-600' : rate > 0 ? 'text-brand-600' : 'text-gray-400'}">${rate}%</div>

  },

  // ─── 课程计划 ─────────────────────────────
  renderPlanTab(el) {
    const company = this._isSuperAdmin() ? (this._companyFilter || '') : this._getCompany();
    const localStorageUsers = this._getFilteredUsers().filter(u => u.role === 'rep' || u.role === 'manager' || u.role === 'cm');

    // Build rep list: merge PRESET_REPS + localStorage users, deduplicate by name
    const repMap = {};
    // From PRESET_REPS
    if (typeof PRESET_REPS !== 'undefined') {
      const presetCompanies = this._isSuperAdmin() && !this._companyFilter
        ? Object.keys(PRESET_REPS)
        : [company].filter(c => PRESET_REPS[c]);
      presetCompanies.forEach(c => {
        (PRESET_REPS[c] || []).forEach(r => {
          const key = c + '|' + r.n;
          if (!repMap[key]) repMap[key] = { name: r.n, empId: r.e, company: c };
        });
      });
    }
    // From localStorage
    localStorageUsers.forEach(u => {
      const key = u.company + '|' + u.name;
      if (!repMap[key]) repMap[key] = { name: u.name, phone: u.phone, company: u.company, coursePlan: u.coursePlan };
    });

    const reps = Object.values(repMap).sort((a, b) => a.company.localeCompare(b.company) || a.name.localeCompare(b.name));
    const courses = (typeof DATA !== 'undefined' && DATA.courses) ? DATA.courses : [];

    // Group courses by product line
    const byLine = {};
    courses.forEach(c => {
      if (!byLine[c.productLine]) byLine[c.productLine] = { name: c.productLineName, courses: [] };
      byLine[c.productLine].courses.push(c);
    });

    // Group reps by company for display
    const repsByCompany = {};
    reps.forEach(r => {
      if (!repsByCompany[r.company]) repsByCompany[r.company] = [];
      repsByCompany[r.company].push(r);
    });

    el.innerHTML = `<div class="space-y-4">
      <div class="card">
        <div class="font-semibold mb-1">分配课程计划</div>
        <div class="text-sm text-gray-500 mb-4">选择小二（支持多选），勾选课程，保存后小二将按此计划学习</div>

        <!-- Multi-select user list -->
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-medium text-gray-700">选择小二 (${reps.length}人)</label>
            <div class="flex gap-2">
              <button onclick="Admin._selectAllReps(true)" class="text-xs text-brand-600 hover:text-brand-800">全选</button>
              <button onclick="Admin._selectAllReps(false)" class="text-xs text-gray-500 hover:text-gray-700">清空</button>
            </div>
          </div>
          <input type="text" id="plan-rep-search" placeholder="搜索姓名..." oninput="Admin._filterRepList()" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm mb-2">
          <div id="plan-rep-list" class="max-h-48 overflow-y-auto border border-gray-100 rounded-lg p-2 space-y-1">
            ${Object.entries(repsByCompany).map(([co, coReps]) => `
              <div class="rep-company-group">
                <div class="text-xs font-medium text-gray-500 mb-1 mt-1">${co} (${coReps.length}人)</div>
                <div class="flex flex-wrap gap-1">
                  ${coReps.map(r => {
                    const id = (r.phone || r.empId || r.name);
                    const hasPlan = r.coursePlan && r.coursePlan.length > 0;
                    return `<label class="rep-item inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full cursor-pointer border transition ${hasPlan ? 'bg-brand-50 border-brand-300 text-brand-700' : 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-gray-100'}" data-name="${r.name}">
                      <input type="checkbox" class="plan-rep-cb" value="${id}" data-company="${co}" data-name="${r.name}" onchange="Admin._onRepSelectionChange()">
                      <span>${r.name}</span>
                      ${hasPlan ? '<span class="text-[10px] text-brand-500">已分配</span>' : ''}
                    </label>`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          <div id="plan-rep-count" class="text-xs text-gray-400 mt-1">已选 0 人</div>
        </div>

        <!-- Course selection -->
        <div id="plan-courses-area">
          <div class="flex gap-2 mb-3">
            <button onclick="Admin._selectAllCourses(true)" class="px-3 py-1.5 text-xs bg-gray-100 text-gray-600 rounded-lg">全选课程</button>
            <button onclick="Admin._selectAllCourses(false)" class="px-3 py-1.5 text-xs bg-gray-100 text-gray-600 rounded-lg">清空选择</button>
          </div>
          ${Object.entries(byLine).map(([line, group]) => `
            <div class="mb-3">
              <div class="text-sm font-medium text-gray-700 mb-1">${group.name}</div>
              <div class="flex flex-wrap gap-2">
                ${group.courses.map(c => `<label class="inline-flex items-center gap-1 text-xs bg-gray-50 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-brand-50 border border-transparent has-[:checked]:border-brand-400 has-[:checked]:bg-brand-50">
                  <input type="checkbox" class="plan-course-cb" value="${c.id}">
                  <span>${c.title}</span>
                </label>`).join('')}
              </div>
            </div>
          `).join('')}
        </div>

        <button onclick="Admin.savePlan()" class="w-full mt-4 py-3 bg-brand-600 text-white rounded-xl font-medium">保存课程计划</button>
      </div>
    </div>`;
  },

  _selectAllReps(checked) {
    document.querySelectorAll('.plan-rep-cb').forEach(cb => {
      if (!cb.closest('.rep-item').classList.contains('hidden')) cb.checked = checked;
    });
    this._onRepSelectionChange();
  },

  _filterRepList() {
    const query = (document.getElementById('plan-rep-search').value || '').trim().toLowerCase();
    document.querySelectorAll('.rep-item').forEach(el => {
      const name = (el.dataset.name || '').toLowerCase();
      el.classList.toggle('hidden', query && !name.includes(query));
    });
  },

  _onRepSelectionChange() {
    const count = document.querySelectorAll('.plan-rep-cb:checked').length;
    const countEl = document.getElementById('plan-rep-count');
    if (countEl) countEl.textContent = '已选 ' + count + ' 人';

    // If exactly one rep is selected, pre-check their existing coursePlan
    const checked = [...document.querySelectorAll('.plan-rep-cb:checked')];
    if (checked.length === 1) {
      const name = checked[0].dataset.name;
      const company = checked[0].dataset.company;
      const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
      const user = allUsers.find(u => u.name === name && u.company === company);
      if (user && user.coursePlan) {
        document.querySelectorAll('.plan-course-cb').forEach(cb => {
          cb.checked = user.coursePlan.includes(cb.value);
        });
      }
    } else if (checked.length === 0) {
      document.querySelectorAll('.plan-course-cb').forEach(cb => { cb.checked = false; });
    }
  },

  _renderPlanCourses() {},

  _selectAllCourses(checked) {
    document.querySelectorAll('.plan-course-cb').forEach(cb => { cb.checked = checked; });
  },

  savePlan() {
    const checkedReps = [...document.querySelectorAll('.plan-rep-cb:checked')];
    const courseIds = [...document.querySelectorAll('.plan-course-cb:checked')].map(cb => cb.value);

    if (checkedReps.length === 0) return App.toast('请选择至少一个小二');
    if (courseIds.length === 0) return App.toast('请选择至少一门课程');

    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    let updated = 0;

    checkedReps.forEach(cb => {
      const name = cb.dataset.name;
      const company = cb.dataset.company;
      const phone = cb.value;

      // Find existing user or create new one
      let idx = allUsers.findIndex(u => u.name === name && u.company === company);
      if (idx === -1) {
        // Create new user entry from preset data
        allUsers.push({
          id: 'u_preset_' + Date.now() + '_' + updated,
          company: company,
          name: name,
          phone: phone,
          role: 'rep',
          loginType: 'normal',
          coursePlan: courseIds,
          createdAt: new Date().toISOString()
        });
        updated++;
      } else {
        allUsers[idx].coursePlan = courseIds;
        updated++;
      }
    });

    localStorage.setItem('atc_all_users', JSON.stringify(allUsers));
    // Sync course plans to Firebase
    if (typeof FirebaseSync !== 'undefined') {
      checkedReps.forEach(cb => {
        FirebaseSync.syncCoursePlan(cb.value, courseIds);
      });
    }
    App.toast(`已为 ${updated} 名小二分配 ${courseIds.length} 门课程`);
  },

  // ─── 学习进度 ─────────────────────────────
  renderProgressTab(el) {
    const users = this._getFilteredUsers();
    const totalCourses = (typeof DATA !== 'undefined' && DATA.courses) ? DATA.courses.length : 0;

    const learnerData = users.map(u => {
      const prog = u.progress || {};
      return {
        user: u,
        completedCourses: prog.completedCourses || [],
        completionRate: prog.completionRate || 0,
        avgQuizScore: prog.avgQuizScore || 0,
        quizAttempts: prog.quizAttempts || 0,
        lastActive: prog.lastActive || null,
        coursePlan: u.coursePlan || []
      };
    });

    learnerData.sort((a, b) => {
      if (a.lastActive && b.lastActive) return new Date(b.lastActive) - new Date(a.lastActive);
      if (a.lastActive) return -1;
      if (b.lastActive) return 1;
      return b.completionRate - a.completionRate;
    });

    const totalLearners = learnerData.length;
    const activeLearners = learnerData.filter(l => l.lastActive).length;
    const allDone = learnerData.filter(l => l.completionRate >= 100).length;
    const avgCompletion = totalLearners ? Math.round(learnerData.reduce((s, l) => s + l.completionRate, 0) / totalLearners) : 0;

    el.innerHTML = `<div class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="card text-center !p-4"><div class="text-2xl font-bold text-brand-600">${totalLearners}</div><div class="text-xs text-gray-400 mt-1">学员总数</div></div>
        <div class="card text-center !p-4"><div class="text-2xl font-bold text-blue-600">${activeLearners}</div><div class="text-xs text-gray-400 mt-1">已学习</div></div>
        <div class="card text-center !p-4"><div class="text-2xl font-bold text-green-600">${allDone}</div><div class="text-xs text-gray-400 mt-1">全部完成</div></div>
        <div class="card text-center !p-4"><div class="text-2xl font-bold ${avgCompletion >= 80 ? 'text-green-600' : avgCompletion >= 50 ? 'text-orange-500' : 'text-gray-500'}">${avgCompletion}%</div><div class="text-xs text-gray-400 mt-1">平均完成率</div></div>
      </div>

      ${totalLearners > 0 ? `<div class="flex justify-end">
        <button onclick="Admin.exportProgress()" class="px-4 py-2 bg-brand-600 text-white rounded-xl text-sm font-medium">导出学习进度 CSV</button>
      </div>` : ''}

      <div class="space-y-3">
        ${totalLearners === 0 ? '<div class="text-center text-gray-400 py-8">暂无学员数据</div>' : ''}
        ${learnerData.map(ld => this._renderLearnerCard(ld, totalCourses)).join('')}
      </div>
    </div>`;
  },

  _renderLearnerCard(ld, totalCourses) {
    const { user, completedCourses, completionRate, avgQuizScore, quizAttempts, lastActive, coursePlan } = ld;
    const barColor = completionRate >= 100 ? 'bg-green-500' : completionRate >= 50 ? 'bg-blue-500' : completionRate > 0 ? 'bg-orange-400' : 'bg-gray-300';
    const lastActiveStr = lastActive ? new Date(lastActive).toLocaleDateString('zh-CN') + ' ' + new Date(lastActive).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '未记录';
    const planInfo = coursePlan.length > 0 ? `<span class="badge badge-orange ml-1">计划${coursePlan.length}门</span>` : '';
    const courseTags = completedCourses.length > 0
      ? `<div class="mt-3 flex flex-wrap gap-1">${completedCourses.map(c => `<span class="inline-block px-2 py-0.5 bg-green-50 text-green-700 text-xs rounded-full">${c.name || c.id}</span>`).join('')}</div>`
      : '';

    return `<div class="card">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 bg-brand-50 rounded-full flex items-center justify-center text-sm font-bold text-brand-700">${(user.name || '?')[0]}</div>
        <div class="flex-1">
          <div class="flex items-center">
            <span class="font-semibold text-gray-900">${user.name || '未知'}</span>
            ${completionRate >= 100 ? '<span class="badge badge-green ml-2">已完成</span>' : completionRate > 0 ? '<span class="badge badge-blue ml-2">学习中</span>' : '<span class="badge badge-gray ml-2">未开始</span>'}
            ${planInfo}
          </div>
          <div class="text-xs text-gray-400">${user.company || ''} · ${App.roleName(user.role)} · 最近活跃 ${lastActiveStr}</div>
        </div>
        <div class="text-right">
          <div class="text-lg font-bold ${completionRate >= 100 ? 'text-green-600' : completionRate > 0 ? 'text-brand-600' : 'text-gray-400'}">${completionRate}%</div>
          <div class="text-xs text-gray-400">完成率</div>
        </div>
      </div>
      <div class="w-full bg-gray-100 rounded-full h-2 mb-3">
        <div class="${barColor} h-2 rounded-full transition-all" style="width: ${Math.min(completionRate, 100)}%"></div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-gray-50 rounded-lg py-2"><div class="text-sm font-bold text-gray-700">${completedCourses.length}<span class="text-gray-400 font-normal">/${totalCourses}</span></div><div class="text-xs text-gray-400">已完成</div></div>
        <div class="bg-gray-50 rounded-lg py-2"><div class="text-sm font-bold text-gray-700">${quizAttempts}</div><div class="text-xs text-gray-400">测验次数</div></div>
        <div class="bg-gray-50 rounded-lg py-2"><div class="text-sm font-bold ${avgQuizScore >= 80 ? 'text-green-600' : avgQuizScore > 0 ? 'text-orange-500' : 'text-gray-400'}">${avgQuizScore > 0 ? avgQuizScore + '%' : '-'}</div><div class="text-xs text-gray-400">平均测验分</div></div>
      </div>
      ${courseTags}
    </div>`;
  },

  // ─── 考试数据 ─────────────────────────────
  renderExamsTab(el) {
    const history = JSON.parse(localStorage.getItem('exam_history') || '[]');
    const users = this._getFilteredUsers();
    const phones = users.map(u => u.phone);

    // Filter exams by user phone if available, otherwise show all
    const filteredHistory = this._isSuperAdmin() && !this._companyFilter
      ? history
      : history.filter(e => !e.userPhone || phones.includes(e.userPhone));

    el.innerHTML = `<div class="space-y-3">
      <div class="text-sm text-gray-500 mb-2">考试记录（${filteredHistory.length}条）</div>
      ${filteredHistory.length === 0 ? '<div class="text-center text-gray-400 py-8">暂无考试数据</div>' :
        `<div class="card !p-0 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="bg-gray-50">
                <th class="px-3 py-2 text-left font-medium text-gray-600">学员</th>
                <th class="px-3 py-2 text-left font-medium text-gray-600">试卷</th>
                <th class="px-3 py-2 text-center font-medium text-gray-600">分数</th>
                <th class="px-3 py-2 text-center font-medium text-gray-600">结果</th>
                <th class="px-3 py-2 text-right font-medium text-gray-600">时间</th>
              </tr></thead>
              <tbody>
                ${filteredHistory.slice().reverse().map(e => {
                  const allU = JSON.parse(localStorage.getItem('atc_all_users') || '[]');

                  return `<tr class="border-t border-gray-50">
                    <td class="px-3 py-2.5 text-xs">${eu ? eu.name : (e.userPhone || '-')}</td>
                    <td class="px-3 py-2.5">${e.paperName}</td>

              </tbody>
            </table>
          </div>
        </div>`
      }
    </div>`;
  },

  // ─── 数据导出 ─────────────────────────────
  renderExportTab(el) {
    el.innerHTML = `<div class="space-y-4">
      <div class="card">
        <div class="font-semibold mb-2">导出用户数据</div>
        <div class="text-sm text-gray-500 mb-3">${this._isSuperAdmin() ? '导出所有服务商用户数据' : '导出本公司用户数据'}</div>
        <button onclick="Admin.exportUsers()" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-medium">导出用户 CSV</button>
      </div>
      <div class="card">
        <div class="font-semibold mb-2">导出学习进度</div>
        <div class="text-sm text-gray-500 mb-3">导出学员课程完成情况和测验成绩</div>
        <button onclick="Admin.exportProgress()" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-medium">导出学习进度 CSV</button>
      </div>
      <div class="card">
        <div class="font-semibold mb-2">导出考试数据</div>
        <div class="text-sm text-gray-500 mb-3">导出所有考试记录</div>
        <button onclick="Admin.exportExams()" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-medium">导出考试 CSV</button>
      </div>
    </div>`;
  },

  // ─── 导出方法 ─────────────────────────────
  exportProgress() {
    const users = this._getFilteredUsers();
    if (!users.length) return App.toast('暂无学员数据');
    const totalCourses = (typeof DATA !== 'undefined' && DATA.courses) ? DATA.courses.length : 0;
    const BOM = '\uFEFF';
    const header = '服务商,姓名,手机号,角色,已分配课程,已完成课程,课程总数,完成率,测验次数,平均测验分,最近活跃,状态\n';
    const rows = users.map(u => {
      const p = u.progress || {};
      const completed = (p.completedCourses || []).length;
      const rate = p.completionRate || 0;
      const planCount = (u.coursePlan || []).length;
      const status = rate >= 100 ? '已完成' : rate > 0 ? '学习中' : '未开始';
      const lastActive = p.lastActive ? new Date(p.lastActive).toLocaleString('zh-CN') : '-';
      return `"${u.company || ''}","${u.name || ''}","${u.phone || ''}","${App.roleName(u.role)}",${planCount},${completed},${totalCourses},${rate}%,${p.quizAttempts || 0},${p.avgQuizScore || 0}%,"${lastActive}","${status}"`;
    }).join('\n');
    this.downloadCSV(BOM + header + rows, '学习进度_' + new Date().toISOString().slice(0, 10) + '.csv');
  },

  exportUsers() {
    const users = this._getFilteredUsers();
    if (!users.length) return App.toast('暂无用户数据');
    const BOM = '\uFEFF';
    const header = '服务商,姓名,手机号,角色,注册时间\n';
    const rows = users.map(u => `"${u.company}","${u.name}","${u.phone}","${App.roleName(u.role)}","${new Date(u.createdAt).toLocaleString('zh-CN')}"`).join('\n');
    this.downloadCSV(BOM + header + rows, '用户数据_' + new Date().toISOString().slice(0, 10) + '.csv');
  },

  exportExams() {
    const history = JSON.parse(localStorage.getItem('exam_history') || '[]');
    if (!history.length) return App.toast('暂无考试数据');
    const BOM = '\uFEFF';
    const header = '学员,服务商,试卷名称,分数,及格线,结果,用时,考试日期\n';
    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    const rows = history.map(e => {
      const eu = allUsers.find(u => u.phone === e.userPhone);
      return `"${eu ? eu.name : '-'}","${eu ? eu.company : '-'}","${e.paperName}",${e.score},${e.passScore},"${e.score >= e.passScore ? '通过' : '未通过'}","${e.timeUsed || '-'}","${new Date(e.date).toLocaleString('zh-CN')}"`;
    }).join('\n');
    this.downloadCSV(BOM + header + rows, '考试数据_' + new Date().toISOString().slice(0, 10) + '.csv');
  },

  downloadCSV(content, filename) {
    const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    App.toast('导出成功');
  }
};

</script>
  <script>
    // Initialize app
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
