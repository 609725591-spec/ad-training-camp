  // ========== 处理用户输入 ==========

  function processUserInput(text) {
    if (!text || !text.trim()) return;

    // 添加用户消息
    addMessage('user', text);
    practiceState.turnCount++;

    // 评分
    updateScores(text);

    // 生成商户回复
    const response = getMerchantResponse(text);
    const replyText = response.reply;

    setTimeout(function () {
      addMessage('merchant', replyText);
      speakMerchant(replyText);
    }, 800 + Math.random() * 600);
  }

  // ========== 商户回复生成 ==========

  function getMerchantResponse(userText) {
    const scenario = practiceState.scenario;
    if (!scenario || !scenario.responses || scenario.responses.length === 0) {
      // No scenario responses, use generic
      return { reply: GENERIC_RESPONSES[Math.floor(Math.random() * GENERIC_RESPONSES.length)], followUp: null };
    }

    const textLower = userText.toLowerCase();

    // Try matching scenario-specific responses
    for (const resp of scenario.responses) {
      if (!resp.keywords || resp.keywords.length === 0) continue;
      const matched = resp.keywords.some(kw => textLower.includes(kw.toLowerCase()));
      if (matched) {
        const replies = resp.replies || [resp.reply || ''];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        return { reply: reply, followUp: resp.followUp || null };
      }
    }

    // Fallback to generic
    return {
      reply: GENERIC_RESPONSES[Math.floor(Math.random() * GENERIC_RESPONSES.length)],
      followUp: null
    };
  }

  // ========== 实时评分 ==========

  function updateScores(userText) {
    const textLower = userText.toLowerCase();
    const totalTurns = practiceState.turnCount;

    for (const dim in SCORING_KEYWORDS) {
      const config = SCORING_KEYWORDS[dim];
      const matched = config.keywords.filter(kw => textLower.includes(kw.toLowerCase()));
      const matchRatio = matched.length / config.keywords.length;

      // Incremental scoring: base gain from matches, diminishing returns
      let gain = 0;
      if (matched.length > 0) {
        gain = Math.min(matchRatio * 30, 15); // Max 15 points per turn
      }

      // Bonus for diversity (different keywords matched across turns)
      const currentScore = practiceState.scores[dim] || 0;
      const newScore = Math.min(currentScore + gain, 100);

      // Slight decay if no keywords matched this turn
      if (matched.length === 0 && totalTurns > 3) {
        practiceState.scores[dim] = Math.max(currentScore - 1, 0);
      } else {
        practiceState.scores[dim] = newScore;
      }
    }

    updateScoreBar();
  }

  // ========== 结束对练 ==========

  function endPractice() {
    if (practiceState.messages.length < 2) {
      if (!confirm('对话内容较少，确定要结束对练吗？')) return;
    } else {
      if (!confirm('确定要结束本次对练吗？')) return;
    }

    // Stop any ongoing speech
    if (speechSynthesis) speechSynthesis.cancel();
    if (recognition && practiceState.isRecording) {
      try { recognition.stop(); } catch (e) { /* ignore */ }
    }

    // Calculate final scores (average of dimension scores)
    const scores = practiceState.scores;
    const dimensions = Object.keys(scores);
    const overallScore = dimensions.length > 0
      ? Math.round(dimensions.reduce((sum, d) => sum + (scores[d] || 0), 0) / dimensions.length)
      : 0;

    const report = {
      scenarioId: practiceState.scenario ? practiceState.scenario.id : '',
      scenarioName: practiceState.scenario ? (practiceState.scenario.merchantName || '') : '',
      overallScore: overallScore,
      scores: Object.assign({}, scores),
      messages: practiceState.messages.slice(),
      turnCount: practiceState.turnCount,
      duration: Math.round((Date.now() - practiceState.startTime) / 1000),
      date: new Date().toISOString()
    };

    // Save
    const history = getHistory();
    history.push(report);
    saveHistory(history);

    renderReport(report);
  }

  // ========== 渲染报告 ==========

  function renderReport(report) {
    const app = window.App;

    if (!container) return;

    let html = '';

    // 总分

    // 维度分数
    html += '<div class="px-4 mt-4 space-y-3">';
    html += '<h3 class="text-sm font-semibold text-gray-700">维度评分</h3>';

    const dimConfig = {
      professional: { label: '话术专业度', icon: '📊' },
      objection: { label: '异议处理', icon: '🛡️' },
      closing: { label: '促成技巧', icon: '🎯' },
      product: { label: '产品知识', icon: '📦' }
    };

    for (const dim in dimConfig) {
      const cfg = dimConfig[dim];
      const score = (report.scores && report.scores[dim]) || 0;
      const barColor = score >= 70 ? 'bg-green-500' : (score >= 40 ? 'bg-yellow-500' : 'bg-red-400');

      html += '<div class="flex items-center gap-3">';
      html += '<span class="text-base flex-shrink-0">' + cfg.icon + '</span>';
      html += '<div class="flex-1">';
      html += '<div class="flex items-center justify-between mb-0.5">';
      html += '<span class="text-xs text-gray-600">' + cfg.label + '</span>';
      html += '<span class="text-xs font-medium text-gray-800">' + Math.round(score) + '分</span>';
      html += '</div>';
      html += '<div class="h-2 bg-gray-200 rounded-full overflow-hidden">';
      html += '<div class="h-full rounded-full transition-all duration-700 ' + barColor + '" style="width:' + Math.min(score, 100) + '%"></div>';
      html += '</div></div></div>';
    }
    html += '</div>';

    // 对话回顾
    html += '<div class="px-4 mt-6">';
    html += '<h3 class="text-sm font-semibold text-gray-700 mb-3">对话回顾</h3>';

    for (let i = 0; i < report.messages.length; i++) {
      const msg = report.messages[i];
      const isUser = msg.role === 'user';

      // Per-message annotation
      let annotation = '';
      let annotClass = '';
      if (isUser) {
        const textLower = msg.text.toLowerCase();
        let goodKeywords = 0;
        for (const dim in SCORING_KEYWORDS) {
          goodKeywords += SCORING_KEYWORDS[dim].keywords.filter(kw => textLower.includes(kw.toLowerCase())).length;
        }
        if (goodKeywords >= 3) {
          annotation = '表达专业，要点清晰';
          annotClass = 'text-green-600 bg-green-50';
        } else if (goodKeywords >= 1) {
          annotation = '有涉及要点，可以更深入';
          annotClass = 'text-yellow-600 bg-yellow-50';
        } else {
          annotation = '建议多提及产品特性和数据';
          annotClass = 'text-orange-600 bg-orange-50';
        }
      }

      html += '<div class="mb-2 p-3 rounded-lg ' + (isUser ? 'bg-indigo-50 ml-4' : 'bg-gray-50 mr-4') + '">';
      html += '<div class="text-[10px] text-gray-400 mb-1">' + (isUser ? '你' : (report.scenarioName || '商户')) + '</div>';
      html += '<div class="text-sm text-gray-700">' + escapeHtml(msg.text) + '</div>';
      if (annotation) {
        html += '<div class="mt-1 text-[10px] px-2 py-0.5 rounded ' + annotClass + '">' + annotation + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';

    // 建议
    html += '<div class="px-4 mt-4 mb-4">';
    html += '<h3 class="text-sm font-semibold text-gray-700 mb-2">改进建议</h3>';
    html += '<div class="p-3 bg-blue-50 rounded-lg text-xs text-blue-700 space-y-1">';

    const suggestions = generateSuggestions(report.scores);
    for (const s of suggestions) {
      html += '<p>• ' + s + '</p>';
    }

    html += '</div></div>';

    // 操作按钮
    html += '<div class="px-4 pb-8 flex gap-3">';
    html += '<button onclick="window.App && window.App.navigate(\'practice\')" class="flex-1 py-3 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">返回首页</button>';
    html += '<button onclick="window.AIPractice.startPractice(\'' + (report.scenarioId || '') + '\')" class="flex-1 py-3 bg-white border border-indigo-600 text-indigo-600 text-sm font-medium rounded-lg hover:bg-indigo-50 transition-colors">再练一次</button>';

  function generateSuggestions(scores) {
    const suggestions = [];

    if ((scores.professional || 0) < 50) {
      suggestions.push('话术专业度偏低，建议多使用行业术语（如CPC、OCPC、ROI等），体现对产品的深入理解。');
    }
    if ((scores.objection || 0) < 50) {
      suggestions.push('异议处理能力需加强，多准备案例数据和赔付保障方案来回应商户顾虑。');
    }
    if ((scores.closing || 0) < 50) {
      suggestions.push('促成技巧有待提升，尝试使用限时优惠、免费试用等话术引导商户做决定。');
    }
    if ((scores.product || 0) < 50) {
      suggestions.push('产品知识掌握不够扎实，建议回顾课程内容，熟悉各产品线的价格、门槛和特性。');
    }

    if (suggestions.length === 0) {
      suggestions.push('整体表现不错！继续保持专业性的同时，可以尝试更多样化的沟通策略。');
    }

    return suggestions;
  }

  // ========== Toast ==========

  function showToast(message) {
    let toast = document.getElementById('practice-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'practice-toast';
      toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-gray-900 text-white text-sm rounded-lg shadow-lg transition-opacity duration-300';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(function () {
      toast.style.opacity = '0';
    }, 3000);
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    if (m > 0) return m + '分' + s + '秒';
    return s + '秒';
  }

  // ========== 历史记录 ==========

  // getHistory already defined above

  // ========== 暴露到 window.AIPractice ==========

  window.AIPractice = {
    state: practiceState,
    renderList: renderList,
    startPractice: startPractice,
    renderChatUI: renderChatUI,
    addMessage: addMessage,
    startRecording: startRecording,
    stopRecording: stopRecording,
    toggleInputMode: toggleInputMode,
    sendTextMessage: sendTextMessage,
    processUserInput: processUserInput,
    getMerchantResponse: getMerchantResponse,
    updateScores: updateScores,
    speakMerchant: speakMerchant,
    endPractice: endPractice,
    renderReport: renderReport,
    renderTextInput: renderTextInput,
    checkSupport: checkSupport,
    getHistory: getHistory
  };

})();

</script>
  <script>
/* 广告特训营 - Admin Panel */

window.Admin = {
  _authenticated: false,

  render(container) {
    App.setActiveTab('admin');
    document.getElementById('page-title').textContent = '管理后台';

    if (!this._authenticated) {
      container.innerHTML = `
        <div class="animate-fade-in flex items-center justify-center min-h-[60vh]">
          <div class="w-full max-w-sm mx-auto">
            <div class="card text-center !p-8">
              <div class="w-16 h-16 bg-brand-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              </div>
              <h3 class="text-lg font-bold text-gray-900 mb-1">管理后台</h3>
              <p class="text-sm text-gray-400 mb-6">请输入管理密码以继续访问</p>
              <div id="admin-pwd-error" class="hidden text-sm text-red-500 mb-2">密码错误，请重试</div>
              <input id="admin-pwd-input" type="password" placeholder="请输入管理密码"
                class="w-full px-4 py-3 rounded-xl border border-gray-200 text-center text-lg tracking-wider focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all"
                onkeydown="if(event.key==='Enter')Admin.checkPassword()">
              <button onclick="Admin.checkPassword()"
                class="w-full mt-4 py-3 bg-brand-600 text-white rounded-xl font-medium hover:bg-brand-700 transition-colors">
                确认进入
              </button>
              <button onclick="location.hash='#home'"
                class="w-full mt-2 py-2 text-sm text-gray-400 hover:text-gray-600">
                返回首页
              </button>
            </div>
          </div>
        </div>`;
      setTimeout(() => { const inp = document.getElementById('admin-pwd-input'); if (inp) inp.focus(); }, 100);
      return;
    }

    this._renderPanel(container);
  },

  checkPassword() {
    const input = document.getElementById('admin-pwd-input');
    const errorEl = document.getElementById('admin-pwd-error');
    if (!input) return;
    if (input.value === 'gaode2026') {
      this._authenticated = true;
      if (errorEl) errorEl.classList.add('hidden');
      this.render(App.getContentContainer());
    } else {
      if (errorEl) errorEl.classList.remove('hidden');
      input.value = '';
      input.focus();
      input.classList.add('border-red-300');
      setTimeout(() => input.classList.remove('border-red-300'), 1500);
    }
  },

  _renderPanel(container) {

    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    const examHistory = JSON.parse(localStorage.getItem('exam_history') || '[]');
    const practiceHistory = JSON.parse(localStorage.getItem('practice_history') || '[]');

    // Compute stats
    const totalUsers = allUsers.length;
    const totalExams = examHistory.length;
    const avgScore = totalExams ? Math.round(examHistory.reduce((s,e) => s + e.score, 0) / totalExams) : 0;
    const passRate = totalExams ? Math.round(examHistory.filter(e => e.score >= e.passScore).length / totalExams * 100) : 0;

    // Group users by company
    const byCompany = {};
    allUsers.forEach(u => {
      if (!byCompany[u.company]) byCompany[u.company] = [];
      byCompany[u.company].push(u);
    });

    container.innerHTML = `<div class="animate-fade-in space-y-4">
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-brand-600">${totalUsers}</div>
          <div class="text-xs text-gray-400 mt-1">注册用户</div>
        </div>
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-green-600">${totalExams}</div>
          <div class="text-xs text-gray-400 mt-1">考试次数</div>
        </div>
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold text-orange-600">${avgScore}</div>
          <div class="text-xs text-gray-400 mt-1">平均分</div>
        </div>
        <div class="card text-center !p-4">
          <div class="text-3xl font-bold ${passRate >= 80 ? 'text-green-600' : 'text-red-500'}">${passRate}%</div>
          <div class="text-xs text-gray-400 mt-1">通过率</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="Admin.showTab('users')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-brand-600 text-white" data-tab="users">用户管理</button>
        <button onclick="Admin.showTab('exams')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600" data-tab="exams">考试数据</button>
        <button onclick="Admin.showTab('export')" class="admin-tab px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-600" data-tab="export">数据导出</button>
      </div>

      <!-- Tab content -->
      <div id="admin-tab-content"></div>
    </div>`;

    this.showTab('users');
  },

  showTab(tab) {
    document.querySelectorAll('.admin-tab').forEach(b => {
      b.classList.toggle('bg-brand-600', b.dataset.tab === tab);
      b.classList.toggle('text-white', b.dataset.tab === tab);
      b.classList.toggle('bg-gray-100', b.dataset.tab !== tab);
      b.classList.toggle('text-gray-600', b.dataset.tab !== tab);
    });
    const el = document.getElementById('admin-tab-content');
    switch(tab) {
      case 'users': this.renderUsersTab(el); break;
      case 'exams': this.renderExamsTab(el); break;
      case 'export': this.renderExportTab(el); break;
    }
  },

  renderUsersTab(el) {
    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    const byCompany = {};
    allUsers.forEach(u => {
      if (!byCompany[u.company]) byCompany[u.company] = [];
      byCompany[u.company].push(u);
    });

    el.innerHTML = `<div class="space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-500">共 ${allUsers.length} 名用户</span>
        <button onclick="Admin.addUser()" class="px-4 py-1.5 bg-brand-600 text-white text-sm rounded-lg">+ 添加用户</button>
      </div>
      ${Object.entries(byCompany).map(([company, users]) => `
        <div class="card">
          <div class="font-semibold text-gray-900 mb-2">${company}</div>
          <div class="text-xs text-gray-400 mb-3">${users.length}人</div>
          ${users.map(u => `
            <div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0">
              <div class="w-8 h-8 bg-brand-50 rounded-full flex items-center justify-center text-sm font-medium text-brand-700">${u.name[0]}</div>
              <div class="flex-1">
                <div class="text-sm font-medium">${u.name}</div>
                <div class="text-xs text-gray-400">${u.phone} · ${App.roleName(u.role)}</div>
              </div>
              <button onclick="Admin.removeUser('${u.phone}')" class="text-xs text-red-400 hover:text-red-600">移除</button>
            </div>
          `).join('')}
        </div>
      `).join('')}
      ${allUsers.length === 0 ? '<div class="text-center text-gray-400 py-8">暂无注册用户</div>' : ''}
    </div>`;
  },

  renderExamsTab(el) {
    const history = JSON.parse(localStorage.getItem('exam_history') || '[]');
    const allUsers = JSON.parse(localStorage.getItem('atc_all_users') || '[]');

    el.innerHTML = `<div class="space-y-3">
      <div class="text-sm text-gray-500 mb-2">考试记录（本地数据）</div>
      ${history.length === 0 ? '<div class="text-center text-gray-400 py-8">暂无考试数据</div>' :
        `<div class="card !p-0 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="bg-gray-50">
                <th class="px-3 py-2 text-left font-medium text-gray-600">试卷</th>
                <th class="px-3 py-2 text-center font-medium text-gray-600">分数</th>
                <th class="px-3 py-2 text-center font-medium text-gray-600">结果</th>
                <th class="px-3 py-2 text-right font-medium text-gray-600">时间</th>
              </tr></thead>
              <tbody>
                ${history.map(e => `<tr class="border-t border-gray-50">
                  <td class="px-3 py-2.5">${e.paperName}</td>
                  <td class="px-3 py-2.5 text-center font-bold ${e.score >= e.passScore ? 'text-green-600' : 'text-red-500'}">${e.score}</td>
                  <td class="px-3 py-2.5 text-center"><span class="badge ${e.score >= e.passScore ? 'badge-green' : 'badge-red'}">${e.score >= e.passScore ? '通过' : '未通过'}</span></td>
                  <td class="px-3 py-2.5 text-right text-gray-400 text-xs">${new Date(e.date).toLocaleDateString('zh-CN')}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
        <button onclick="Admin.clearExamHistory()" class="w-full py-2 text-sm text-red-400 hover:text-red-600">清空考试记录</button>`
      }
    </div>`;
  },

  renderExportTab(el) {
    el.innerHTML = `<div class="space-y-4">
      <div class="card">
        <div class="font-semibold mb-2">导出用户数据</div>
        <div class="text-sm text-gray-500 mb-3">将所有注册用户信息导出为CSV文件</div>
        <button onclick="Admin.exportUsers()" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-medium">导出用户 CSV</button>
      </div>
      <div class="card">
        <div class="font-semibold mb-2">导出考试数据</div>
        <div class="text-sm text-gray-500 mb-3">将所有考试记录导出为CSV文件</div>
        <button onclick="Admin.exportExams()" class="px-6 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-medium">导出考试 CSV</button>
      </div>
      <div class="card">
        <div class="font-semibold mb-2">导入用户数据</div>
        <div class="text-sm text-gray-500 mb-3">从CSV文件批量导入用户</div>
        <input type="file" id="import-file" accept=".csv" class="hidden" onchange="Admin.importUsers(event)">
        <button onclick="document.getElementById('import-file').click()" class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm font-medium">选择CSV文件</button>
      </div>
    </div>`;
  },

  addUser() {
    App.showModal(`
      <div class="p-6">
        <h3 class="text-lg font-bold mb-4">添加用户</h3>
        <div class="space-y-3">
          <div><label class="text-sm font-medium text-gray-700">服务商</label><input id="add-company" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200" placeholder="服务商名称"></div>
          <div><label class="text-sm font-medium text-gray-700">姓名</label><input id="add-name" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200" placeholder="用户姓名"></div>
          <div><label class="text-sm font-medium text-gray-700">手机号</label><input id="add-phone" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200" placeholder="手机号" maxlength="11"></div>
          <div><label class="text-sm font-medium text-gray-700">角色</label><select id="add-role" class="w-full mt-1 px-3 py-2 rounded-lg border border-gray-200"><option value="rep">销售小二</option><option value="manager">服务商管理者</option><option value="cm">渠道经理</option></select></div>
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="App.closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl">取消</button>
          <button onclick="Admin.confirmAddUser()" class="flex-1 py-2.5 bg-brand-600 text-white rounded-xl">确认添加</button>
        </div>
      </div>
    `);
  },

  confirmAddUser() {
    const company = document.getElementById('add-company').value.trim();
    const name = document.getElementById('add-name').value.trim();
    const phone = document.getElementById('add-phone').value.trim();
    const role = document.getElementById('add-role').value;
    if (!company || !name || !phone) return App.toast('请填写完整信息');
    const user = { id: 'u_' + Date.now(), company, name, phone, role, createdAt: new Date().toISOString() };
    App.saveAllUsers(user);
    App.closeModal();
    App.toast('用户已添加');
    this.showTab('users');
  },

  removeUser(phone) {
    if (!confirm('确定移除该用户？')) return;
    const users = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    const filtered = users.filter(u => u.phone !== phone);
    localStorage.setItem('atc_all_users', JSON.stringify(filtered));
    App.toast('用户已移除');
    this.showTab('users');
  },

  clearExamHistory() {
    if (!confirm('确定清空所有考试记录？')) return;
    localStorage.setItem('exam_history', '[]');
    App.toast('考试记录已清空');
    this.showTab('exams');
  },

  exportUsers() {
    const users = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
    if (!users.length) return App.toast('暂无用户数据');
    const BOM = '\uFEFF';
    const header = '服务商,姓名,手机号,角色,注册时间\n';
    const rows = users.map(u => `"${u.company}","${u.name}","${u.phone}","${App.roleName(u.role)}","${new Date(u.createdAt).toLocaleString('zh-CN')}"`).join('\n');
    this.downloadCSV(BOM + header + rows, '用户数据_' + new Date().toISOString().slice(0,10) + '.csv');
  },

  exportExams() {
    const history = JSON.parse(localStorage.getItem('exam_history') || '[]');
    if (!history.length) return App.toast('暂无考试数据');
    const BOM = '\uFEFF';
    const header = '试卷名称,分数,及格线,结果,用时,考试日期\n';
    const rows = history.map(e => `"${e.paperName}",${e.score},${e.passScore},"${e.score >= e.passScore ? '通过' : '未通过'}","${e.timeUsed || '-'}","${new Date(e.date).toLocaleString('zh-CN')}"`).join('\n');
    this.downloadCSV(BOM + header + rows, '考试数据_' + new Date().toISOString().slice(0,10) + '.csv');
  },

  importUsers(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result.replace(/^\uFEFF/, '');
      const lines = text.split('\n').filter(l => l.trim());
      const users = JSON.parse(localStorage.getItem('atc_all_users') || '[]');
      let added = 0;
      lines.slice(1).forEach(line => {
        const cols = line.split(',').map(c => c.replace(/"/g, '').trim());
        if (cols.length >= 3 && cols[2] && !users.find(u => u.phone === cols[2])) {
          users.push({ id: 'u_' + Date.now() + '_' + added, company: cols[0], name: cols[1], phone: cols[2], role: cols[3] === '服务商管理者' ? 'manager' : cols[3] === '渠道经理' ? 'cm' : 'rep', createdAt: new Date().toISOString() });
          added++;
        }
      });
      localStorage.setItem('atc_all_users', JSON.stringify(users));
      App.toast(`成功导入 ${added} 名用户`);
      this.showTab('users');
      event.target.value = '';
    };
    reader.readAsText(file, 'UTF-8');
  },

  downloadCSV(content, filename) {
    const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    App.toast('导出成功');
  }
};

</script>
